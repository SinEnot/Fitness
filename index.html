<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tagesmarke</title>
<style>
:root{--bg:#e8ebf0;--card:#fff;--tx:#14181f;--mu:#5d6675;--ac:#2447f5;--ok:#178a4c;--bad:#c93c3c;--bd:#d5d9e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1017;--card:#171b24;--tx:#eef0f4;--mu:#9099a8;--ac:#6d8bff;--ok:#3fc27a;--bad:#ef6b6b;--bd:#2a303c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1017;--card:#171b24;--tx:#eef0f4;--mu:#9099a8;--ac:#6d8bff;--ok:#3fc27a;--bad:#ef6b6b;--bd:#2a303c;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"SF Pro Text",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;padding:20px 16px 40px}
h1{font:700 28px/1.1 "Avenir Next Condensed","Arial Narrow",sans-serif;margin:0 0 2px}
.sub{color:var(--mu);margin:0 0 18px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border:0;border-bottom:1px solid var(--bd);background:none;color:inherit;font:inherit;text-align:left}
.row:last-child{border-bottom:0}
.n{font:700 40px/1 "Avenir Next Condensed","Arial Narrow",sans-serif;min-width:56px}
.nm{flex:1;font-weight:600}
.nm small{display:block;color:var(--mu);font-weight:400}
.go,.sec{width:100%;padding:16px;border-radius:14px;font:700 17px -apple-system,system-ui,sans-serif;margin-bottom:10px}
.go{border:0;background:var(--ac);color:#fff}
.sec{border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.mini{background:none;border:0;color:var(--mu);font:inherit;text-decoration:underline;padding:8px 0}
.km{font:700 64px/1 "Avenir Next Condensed","Arial Narrow",sans-serif;margin:10px 0}
.bad{color:var(--bad)}.ok{color:var(--ok)}
h2{font-size:15px;margin:22px 0 8px;color:var(--mu);font-weight:600}
.h{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}
.h:last-child{border-bottom:0}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:600 15px inherit;font-family:inherit}
.tabs .a{background:var(--ac);border-color:var(--ac);color:#fff}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin:8px 0 14px}
.bar i{display:block;height:100%;background:var(--ac)}
.wo{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin-bottom:10px}
.wo b{font-size:18px}.wo small{display:block;color:var(--mu);margin-top:2px}
.hint{font-size:17px;line-height:1.45}.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}.chips button{flex:none;padding:8px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:600 14px -apple-system,system-ui,sans-serif}.chips .a{background:var(--ac);border-color:var(--ac);color:#fff}input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:16px -apple-system,system-ui,sans-serif;margin-bottom:8px}.g{display:flex;gap:8px;align-items:flex-start}.g>*{flex:1}.err{color:var(--bad)}
</style></head><body><main id="app"></main>
<script>
var EX=[["p","Liegestütze","Hände etwas breiter als die Schultern, Körper bildet eine gerade Linie, Brust fast bis zum Boden, dann kontrolliert hochdrücken."],["k","Klimmzüge","Obergriff schulterbreit, Schulterblätter nach unten ziehen, Kinn über die Stange, langsam wieder ablassen."],["d","Dips","Arme gestreckt auf Barren oder Stuhlkanten, Oberkörper leicht nach vorn, Ellbogen bis etwa 90° beugen, dann hochdrücken."]];
var WK={
"Brust":[["Liegestütze","Hände etwas breiter als die Schultern, Körper gerade, Brust fast bis zum Boden."],["Breite Liegestütze","Hände weit außen, Ellbogen leicht nach hinten, langsam absenken."],["Diamant-Liegestütze","Daumen und Zeigefinger bilden eine Raute, Ellbogen nah am Körper."],["Liegestütze mit Pause","Unten 2 Sekunden halten, dann explosiv hochdrücken."],["Brustpressen","Handflächen vor der Brust zusammenpressen, volle Spannung halten."]],
"Rücken":[["Klimmzüge oder Rudern","Klimmzüge an der Stange, oder unter einem stabilen Tisch liegend hochziehen."],["Superman","Bauchlage, Arme und Beine gleichzeitig heben, kurz halten."],["Y-T-W-Heben","Bauchlage, Arme als Y, T und W nacheinander heben."],["Handtuch-Rudern","Handtuch um einen Türgriff, zurücklehnen und die Schulterblätter zusammenziehen."],["Reverse Snow Angel","Bauchlage, Arme gestreckt in Bogen vom Kopf zu den Hüften führen."]],
"Arme":[["Dips","Arme gestreckt auf Stuhl oder Barren, Ellbogen nach hinten beugen."],["Diamant-Liegestütze","Hände eng zusammen, Ellbogen am Körper, trainiert den Trizeps."],["Untergriff-Klimmzüge","Handflächen zu dir, trainiert vor allem den Bizeps."],["Isometrischer Curl","Handtuch unter einem Fuß, mit den Armen nach oben ziehen und gegenhalten."],["Plank-Ups","Vom Unterarmstütz abwechselnd auf die Hände hochdrücken."]],
"Bauch":[["Crunches","Rücken am Boden, Schulterblätter anheben, Bauch anspannen."],["Plank","Unterarmstütz, Körper eine Linie, Bauch und Po fest."],["Beinheben","Rückenlage, gestreckte Beine langsam heben und kontrolliert senken."],["Bergsteiger","Hochstütz, Knie abwechselnd schnell zur Brust ziehen."],["Russian Twist","Sitzend, Oberkörper leicht zurück, Rumpf nach links und rechts drehen."]],
"Beine":[["Kniebeugen","Füße schulterbreit, Po nach hinten, Rücken gerade, Knie über den Zehen."],["Ausfallschritte","Großer Schritt nach vorn, hinteres Knie fast zum Boden, Seite wechseln."],["Wandsitzen","Rücken an die Wand, Oberschenkel waagerecht, halten."],["Glute Bridge","Rückenlage, Füße aufgestellt, Hüfte heben und oben anspannen."],["Wadenheben","Auf die Zehenspitzen hoch, oben kurz halten, langsam senken."]],
"Schultern":[["Pike-Liegestütze","Hüfte hoch (umgekehrtes V), Kopf zwischen den Armen Richtung Boden senken."],["Schulter-Taps","Hochstütz, abwechselnd mit der Hand die gegenüberliegende Schulter berühren."],["Seitheben","Mit Wasserflaschen die Arme seitlich bis Schulterhöhe heben."],["Schnelle Armkreise","Arme seitlich, kleine schnelle Kreise, nach 20 Sekunden Richtung wechseln."],["Bärenhalte","Auf Händen und Zehen, Knie knapp über dem Boden schweben lassen."]]};
var WARM=[["Armkreisen","Arme seitlich ausstrecken und große Kreise machen, nach 15 Sekunden die Richtung wechseln.",30],["Hampelmänner","Locker springen, Arme und Beine öffnen und schließen.",40],["Schulterkreisen","Schultern langsam nach hinten kreisen, dabei die Brust öffnen.",30],["Hüftkreisen","Füße schulterbreit, Hüfte weit kreisen lassen, nach 15 Sekunden wechseln.",30],["Lockere Kniebeugen","Po nach hinten schieben, Rücken gerade, Knie über den Zehen.",30]];
var S=null,tab="t",run=null,warm=false,done={p:false,k:false,d:false},AC=null,wl=null;
try{S=JSON.parse(localStorage.getItem("tagesmarke"))}catch(e){}
if(!S||!S.t)S={t:{p:5,k:5,d:5},log:[]};S.folders=S.folders||[];S.cur=S.cur||"std";var ed=null,delArm=false;
function save(){try{localStorage.setItem("tagesmarke",JSON.stringify(S))}catch(e){}}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fmt(k){var p=k.split("-");return p[2]+"."+p[1]+"."}
function beep(f,d){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function setTab(t){tab=t;render()}
function ready(){return{t:"Mach dich bereit",i:"Gleich geht es los. Such dir genug Platz und atme ruhig durch.",s:5}}
function begin(kind,name,steps){
  run={kind:kind,name:name,steps:steps,i:0,paused:false,over:false};
  if(kind=="day"){warm=false;done={p:false,k:false,d:false}}if(kind=="cday")done={};
  beep(440,.05);try{navigator.wakeLock.request("screen").then(function(l){wl=l}).catch(function(){})}catch(e){}
  setStep();render();
}
function setStep(){var s=run.steps[run.i];if(s.s){run.end=Date.now()+s.s*1000;run.left=s.s;run.paused=false}}
function startDay(){
  var st=[ready()];
  WARM.forEach(function(w,i){st.push({t:w[0],i:w[1],s:w[2],n:"Warm-up",w:i==WARM.length-1})});
  EX.forEach(function(e,i){
    st.push({t:e[1],i:e[2],k:e[0],reps:S.t[e[0]],n:"Übung "+(i+1)+" von 3"});
    if(i<2)st.push({t:"Pause",i:"Atmen und Arme ausschütteln. Als Nächstes: "+EX[i+1][1]+".",s:60,n:"Pause"});
  });
  begin("day","Tagestraining",st);
}
function startWO(name){
  var st=[ready()],L=WK[name];
  for(var r=1;r<=2;r++)L.forEach(function(e,i){
    st.push({t:e[0],i:e[1],s:40,n:"Runde "+r+" von 2"});
    if(!(r==2&&i==L.length-1))st.push({t:"Pause",i:"Kurz durchatmen. Als Nächstes: "+(L[i+1]?L[i+1][0]:L[0][0])+".",s:20,n:"Pause"});
  });
  begin("wo",name,st);
}
function next(){
  var s=run.steps[run.i];if(s.w)warm=true;
  run.i++;
  if(run.i>=run.steps.length){
    if(run.kind=="day"){finish();quit()}else if(run.kind=="cday"){finishC();quit()}else{run.over=true;beep(880,.5);render()}
    return;
  }
  setStep();render();
}
function ans(ok){done[run.steps[run.i].k]=ok;next()}
function tp(){
  if(run.paused){run.end=Date.now()+run.rem;run.paused=false}else{run.rem=run.end-Date.now();run.paused=true}
  render();
}
function quit(){run=null;try{if(wl)wl.release()}catch(e){}render()}
setInterval(function(){
  if(!run||run.over)return;var s=run.steps[run.i];if(!s.s||run.paused)return;
  var l=Math.ceil((run.end-Date.now())/1000);
  if(l!=run.left){run.left=l;var c=document.getElementById("cd");if(c)c.textContent=Math.max(l,0);if(l>0&&l<=3)beep(660,.08)}
  if(l<=0){if(s.k!==undefined){if(!s.fin){s.fin=1;beep(880,.3)}}else{beep(880,.3);next()}}
},250);
function finish(){
  var b={p:S.t.p,k:S.t.k,d:S.t.d},fails=0;
  EX.forEach(function(e){if(done[e[0]])S.t[e[0]]++;else fails++});
  S.log.unshift({d:today(),b:b,r:{p:done.p,k:done.k,d:done.d},km:fails,j:fails===0});
  warm=false;done={p:false,k:false,d:false};save();
}
function undo(){var e=S.log.shift();if(e)S.t=e.b;save();render()}
function jog(i){S.log[i].j=!S.log[i].j;save();render()}
function open(){return S.log.reduce(function(a,e){return a+(e.j?0:e.km)},0)}
function esc(x){return String(x==null?"":x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var PEN=[["Joggen","km"],["Liegestütze","Wdh."],["Kniebeugen","Wdh."],["Burpees","Wdh."],["Eigene",""]];
function cf(){return S.folders.filter(function(f){return f.id==S.cur})[0]}
function setF(id){S.cur=id;save();render()}
function chips(){var h='<div class="chips"><button class="'+(S.cur=="std"?"a":"")+'" onclick="setF(\'std\')">Standard</button>';S.folders.forEach(function(f){h+='<button class="'+(S.cur==f.id?"a":"")+'" onclick="setF(\''+f.id+'\')">'+esc(f.name)+'</button>'});return h+'<button onclick="newF()">+ Neu</button></div>'}
function newF(){ed={id:null,name:"",items:[{n:"",u:"Wdh.",v:10}],pre:0,pen:{n:"Joggen",u:"km",per:1}};render()}
function editF(){ed=JSON.parse(JSON.stringify(cf()));ed.pre=4;PEN.forEach(function(p,i){if(p[0]==ed.pen.n&&p[1]==ed.pen.u)ed.pre=i});render()}
function addI(){ed.items.push({n:"",u:"Wdh.",v:10});render()}
function delI(i){ed.items.splice(i,1);render()}
function setPre(i){ed.pre=i;if(i<4){ed.pen.n=PEN[i][0];ed.pen.u=PEN[i][1]}else{ed.pen.n="";ed.pen.u=""}render()}
function saveF(){
  var it=ed.items.filter(function(x){return x.n.trim()&&x.v>0});
  if(!ed.name.trim()||!it.length||!ed.pen.n.trim()||!(ed.pen.per>0)){ed.err="Bitte Namen, mindestens eine Übung mit Menge und eine Strafe ausfüllen.";render();return}
  it.forEach(function(x){x.n=x.n.trim()});ed.pen.n=ed.pen.n.trim();ed.pen.u=(ed.pen.u||"").trim();
  if(ed.id){var f=cf();f.name=ed.name.trim();f.items=it;f.pen=ed.pen}
  else{var id="f"+Date.now();S.folders.push({id:id,name:ed.name.trim(),items:it,pen:ed.pen,log:[]});S.cur=id}
  ed=null;delArm=false;save();render();
}
function delF(){if(!delArm){delArm=true;render();return}S.folders=S.folders.filter(function(f){return f.id!=ed.id});S.cur="std";ed=null;delArm=false;save();render()}
function pt(f,n){return(f.pen.per*n)+" "+(f.pen.u?f.pen.u+" ":"")+f.pen.n}
function lab(it){return it.v+" "+it.u}
function startC(){
  var f=cf(),st=[ready()];
  f.items.forEach(function(it,i){
    var s={t:it.n,k:i,n:"Übung "+(i+1)+" von "+f.items.length};
    if(it.u=="Wdh."){s.reps=it.v;s.i="Mach "+it.v+" Wiederholungen in sauberer Ausführung."}
    else{s.s=it.v*(it.u=="Min."?60:1);s.i="Mach die Übung "+lab(it)+" lang. Der Timer läuft. Danach bestätigst du, ob du es geschafft hast."}
    st.push(s);
  });
  begin("cday",f.name,st);
}
function finishC(){var f=cf(),r=f.items.map(function(x,i){return!!done[i]}),n=r.filter(function(x){return!x}).length;f.log.unshift({d:today(),r:r,n:n,pen:n?pt(f,n):"",j:n===0});done={};save()}
function undoC(){cf().log.shift();save();render()}
function jogC(i){var e=cf().log[i];e.j=!e.j;save();render()}
function redit(){
  var h='<h1>'+(ed.id?"Plan bearbeiten":"Neuer Plan")+'</h1><p class="sub">Schreibe auf, was du tun willst. Die Werte bleiben jeden Tag gleich.</p><div class="box"><input placeholder="Name des Ordners" value="'+esc(ed.name)+'" oninput="ed.name=this.value"></div><div class="box">';
  ed.items.forEach(function(it,i){h+='<input placeholder="Übung, z. B. Plank" value="'+esc(it.n)+'" oninput="ed.items['+i+'].n=this.value"><div class="g"><input type="number" inputmode="numeric" min="1" value="'+esc(it.v)+'" oninput="ed.items['+i+'].v=+this.value"><select onchange="ed.items['+i+'].u=this.value">'+["Wdh.","Sek.","Min."].map(function(u){return'<option'+(u==it.u?' selected':'')+'>'+u+'</option>'}).join("")+'</select><button class="mini" onclick="delI('+i+')">Entfernen</button></div>'});
  h+='<button class="sec" onclick="addI()">+ Übung hinzufügen</button></div>';
  h+='<div class="box"><div style="font-weight:600;margin-bottom:8px">Strafe, wenn du eine Übung nicht schaffst</div><select onchange="setPre(+this.value)">'+PEN.map(function(p,i){return'<option value="'+i+'"'+(i==ed.pre?' selected':'')+'>'+p[0]+'</option>'}).join("")+'</select>';
  if(ed.pre==4)h+='<input placeholder="Eigene Strafe, z. B. Treppen steigen" value="'+esc(ed.pen.n)+'" oninput="ed.pen.n=this.value"><input placeholder="Einheit, z. B. Etagen" value="'+esc(ed.pen.u)+'" oninput="ed.pen.u=this.value">';
  h+='<p class="sub" style="margin:0 0 4px">Menge pro nicht geschaffter Übung</p><input type="number" inputmode="numeric" min="1" value="'+esc(ed.pen.per)+'" oninput="ed.pen.per=+this.value"></div>';
  if(ed.err)h+='<p class="err">'+ed.err+'</p>';
  h+='<button class="go" onclick="saveF()">Speichern</button><button class="sec" onclick="ed=null;delArm=false;render()">Abbrechen</button>';
  if(ed.id)h+='<button class="mini" onclick="delF()">'+(delArm?"Wirklich löschen? Tippe erneut":"Ordner löschen")+'</button>';
  return h;
}
function rcustom(){
  var f=cf(),L=f.log[0],h="";
  if(L&&L.d==today()){h+='<div class="box"><div class="km '+(L.n?"bad":"ok")+'" style="font-size:36px">'+(L.n?esc(L.pen):"Alles geschafft")+'</div><p class="sub" style="margin:6px 0 0">'+(L.n?L.n+" von "+L.r.length+" Übungen nicht geschafft. Das ist deine Strafe.":"Keine Strafe heute.")+'</p></div><button class="mini" onclick="undoC()">Heute zurücknehmen</button>'}
  else{h+='<div class="box"><div style="font-weight:600;margin-bottom:4px">'+esc(f.name)+'</div>'+f.items.map(function(it){return'<div class="h"><span>'+esc(it.n)+'</span><b>'+lab(it)+'</b></div>'}).join("")+'<p class="sub" style="margin:10px 0 0">Strafe pro nicht geschaffter Übung: '+esc(pt(f,1))+'</p></div><button class="go" onclick="startC()">Training starten</button>'}
  h+='<button class="mini" onclick="editF()">Plan bearbeiten</button>';
  var o=f.log.filter(function(e){return e.n&&!e.j}).length;
  h+='<h2>Offene Strafen: '+o+'</h2><div class="box">';
  if(!f.log.length)h+='<span class="sub">Noch keine Einträge.</span>';
  f.log.slice(0,30).forEach(function(e,i){h+='<div class="h"><span>'+fmt(e.d)+' · '+e.r.map(function(x){return x?"✓":"✗"}).join(" ")+'</span>'+(e.n?'<button class="mini" style="padding:0;color:'+(e.j?"var(--ok)":"var(--bad)")+'" onclick="jogC('+i+')">'+esc(e.pen)+' '+(e.j?"erledigt":"offen")+'</button>':'<span class="ok">✓</span>')+'</div>'});
  return h+'</div>';
}
function rrun(){
  if(run.over)return `<div class="box"><div class="km ok">Geschafft</div><p class="hint">${run.name}-Workout abgeschlossen. Gut gemacht.</p></div><button class="go" onclick="quit()">Zurück</button>`;
  var s=run.steps[run.i],nx=run.steps[run.i+1],h="";
  h+=`<p class="sub" style="margin:0">${run.name} · ${s.n||"Start"} · Schritt ${run.i+1} von ${run.steps.length}</p><div class="bar"><i style="width:${Math.round(run.i/run.steps.length*100)}%"></i></div>`;
  h+=`<div class="box"><h1>${s.t}</h1>`;
  h+=s.s?`<div class="km" id="cd">${Math.max(run.left,0)}</div>`:`<div class="km">${s.reps}×</div>`;
  h+=`<p class="hint">${s.i}</p>`;
  if(nx)h+=`<p class="sub" style="margin:0">Danach: ${nx.t}</p>`;
  h+=`</div>`;
  if(s.k===undefined&&s.s)h+=`<button class="go" onclick="tp()">${run.paused?"Weiter":"Pause"}</button><button class="sec" onclick="next()">Überspringen</button>`;
  else h+=`<button class="go" onclick="ans(true)">Geschafft</button><button class="sec" onclick="ans(false)">Nicht geschafft</button>`;
  return h+`<button class="mini" onclick="quit()">Training beenden</button>`;
}
function render(){
  var el=document.getElementById("app");
  if(run){el.innerHTML=rrun();return}if(ed){el.innerHTML=redit();return}
  var h=`<h1>Tagesmarke</h1><p class="sub">${new Date().toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"})}</p>`;
  h+=`<div class="tabs"><button class="${tab=="t"?"a":""}" onclick="setTab('t')">Heute</button><button class="${tab=="w"?"a":""}" onclick="setTab('w')">Workouts</button></div>`;
  if(tab=="w"){
    h+=`<p class="sub">Wähle eine Körperstelle. Jedes Workout: 2 Runden, 40 Sekunden Übung, 20 Sekunden Pause.</p>`;
    Object.keys(WK).forEach(function(k){h+=`<button class="wo" onclick="startWO('${k}')"><b>${k}</b><small>${WK[k].map(function(e){return e[0]}).join(", ")} · ca. 10 Min</small></button>`});
    el.innerHTML=h;return;
  }
  h+=chips();if(S.cur!="std"){el.innerHTML=h+rcustom();return}var L=S.log[0],isDone=L&&L.d==today();
  if(!isDone){
    h+=`<div class="box"><div style="font-weight:600;margin-bottom:4px">Dein Plan heute</div><div class="h"><span>Warm-up</span><b>ca. 3 Min</b></div>`;
    EX.forEach(function(e){h+=`<div class="h"><span>${e[1]}</span><b>${S.t[e[0]]} Wdh.</b></div>`});
    h+=`</div><button class="go" onclick="startDay()">Training starten</button><p class="sub">Der Timer führt dich durch Warm-up, Übungen und Pausen. Nach jeder Übung bestätigst du, ob du sie geschafft hast.</p>`;
  }else{
    h+=`<div class="box"><div class="km ${L.km?"bad":"ok"}" style="font-size:44px">${L.km?L.km+" km":"Alles geschafft"}</div><p class="sub" style="margin:6px 0 0">${L.km?"Joggen heute, weil "+L.km+" von 3 Übungen offen blieben.":"Kein Joggen heute."}</p></div>`;
    h+=`<div class="box"><div style="font-weight:600;margin-bottom:6px">Morgen</div>`;
    EX.forEach(function(e){h+=`<div class="h"><span>${e[1]}</span><b>${S.t[e[0]]}</b></div>`});
    h+=`</div><button class="mini" onclick="undo()">Heute zurücknehmen</button>`;
  }
  h+=`<h2>Offene Jogging-Kilometer: ${open()}</h2><div class="box">`;
  if(!S.log.length)h+=`<span class="sub">Noch keine Einträge.</span>`;
  S.log.slice(0,30).forEach(function(e,i){
    var m=EX.map(function(x){return(e.r[x[0]]?"✓":"✗")+e.b[x[0]]}).join(" ");
    h+=`<div class="h"><span>${fmt(e.d)} · ${m}</span>`+(e.km?`<button class="mini" style="padding:0;color:${e.j?"var(--ok)":"var(--bad)"}" onclick="jog(${i})">${e.km} km ${e.j?"gejoggt":"offen"}</button>`:`<span class="ok">✓</span>`)+`</div>`;
  });
  el.innerHTML=h+`</div>`;
}
render();
</script></body></html>
